<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <main>

        <section id="add-expense">
            <h2>Add Expense</h2>

            <label for="expense-name">Expense Name</label>
            <input type="text" id="expense-name" placeholder="Enter expense name">

            <label for="expense-amount">Amount</label>
            <input type="number" id="expense-amount" placeholder="Enter amount">

            <label for="expense-category">Category</label>
            <input type="text" id="expense-category" placeholder="Enter category">
        </section>

        <section class="expenses-section">
            <h2>Your Expenses</h2>
            <p>No expenses yet.</p>
        </section>

    </main>

</body>
</html>
